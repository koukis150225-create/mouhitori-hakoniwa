<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>もうひとりの箱庭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
body{margin:0}
/* Layout: 箱庭ステージ（キャンバス）が主役、右に日記帳パネル。スマホでは縦積み */
:root{
  --bg:#eceff6; --panel:#ffffff; --panel-2:#f4f6fb; --ink:#2b2945; --ink-soft:#66648a;
  --line:#dfe2ee; --accent:#f2a33a; --accent-ink:#3a2503; --leaf:#4b9c69; --stage:#dde8f4;
  --danger:#c8504a; --night:0;
  --f-display:"Yusei Magic","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12142a; --panel:#1b1e37; --panel-2:#232746; --ink:#eceaf8; --ink-soft:#a5a3c4;
  --line:#2f3353; --accent:#f5b55a; --accent-ink:#2a1a00; --leaf:#7cc896; --stage:#191e3d;
  --danger:#ef8a82; --night:1; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#12142a; --panel:#1b1e37; --panel-2:#232746; --ink:#eceaf8; --ink-soft:#a5a3c4;
  --line:#2f3353; --accent:#f5b55a; --accent-ink:#2a1a00; --leaf:#7cc896; --stage:#191e3d;
  --danger:#ef8a82; --night:1; color-scheme:dark }

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}

#app{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;height:100%;padding:16px}
#stage{position:relative;border-radius:24px;overflow:hidden;background:var(--stage);min-height:0;
  box-shadow:inset 0 0 0 1px var(--line)}
#world{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#world:active{cursor:grabbing}

.hud{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:2px;pointer-events:none;
  background:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:blur(6px);
  padding:8px 14px 9px;border-radius:14px}
.hud .town{font-family:var(--f-display);font-size:20px;line-height:1.2}
.hud .meta{font-size:12px;color:var(--ink-soft);letter-spacing:.04em}

.hud .hint2{font-size:11px;opacity:.8}
#stage.inroom .hud,#stage.inroom .zoom{display:none}
#room{position:absolute;inset:0;pointer-events:none}
.room-head{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:2px;background:color-mix(in srgb,var(--panel) 86%,transparent);backdrop-filter:blur(6px);padding:8px 14px 9px;border-radius:14px}
.room-head .town{font-family:var(--f-display);font-size:20px;line-height:1.2}
.room-head .meta{font-size:12px;color:var(--ink-soft)}
.room-actions{position:absolute;right:12px;top:14px;display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 24px)}
.rbtn{border:0;border-radius:12px;padding:8px 14px;font-weight:700;font-size:14px;background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(6px)}
.rbtn.dark{background:var(--ink);color:var(--bg)}
@media (max-width:520px){ .room-actions{top:auto;bottom:12px} }
.zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}
.zoom button{border:0;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(6px);
  min-width:38px;height:38px;border-radius:12px;font-weight:700;padding:0 10px;font-size:14px}
.zoom button:hover{background:var(--panel)}

#toast{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);max-width:calc(100% - 32px);
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:700;font-size:14px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:translate(-50%,12px) scale(.9);opacity:0}}

#panel{background:var(--panel);border-radius:24px;min-height:0;overflow:auto;display:flex;flex-direction:column;
  box-shadow:inset 0 0 0 1px var(--line)}
.p-head{padding:20px 22px 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.p-head h1{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.15;margin:0;text-wrap:balance}
.p-head .sub{font-size:12.5px;color:var(--ink-soft)}
#avatarChip{flex:none;width:52px;height:60px;border-radius:14px;background:var(--panel-2);border:0;padding:0;position:relative}
#avatarChip canvas{width:52px;height:60px;display:block}

form#diary{padding:12px 22px 18px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ink-soft)}
#text{width:100%;min-height:112px;resize:vertical;border-radius:14px;border:1.5px solid var(--line);
  background:var(--panel-2);padding:12px 14px;line-height:1.75}
#text:focus{border-color:var(--accent);outline:none}
.moods{display:flex;flex-wrap:wrap;gap:6px}
.mood{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px 4px 9px;
  display:inline-flex;align-items:center;gap:6px;font-size:13.5px}
.mood i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.mood[aria-checked="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:11px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);
  display:inline-flex;align-items:center;gap:8px}
.btn:hover{filter:brightness(1.05)}
.btn[disabled]{opacity:.6;cursor:progress}
.btn.ghost{background:var(--panel-2);color:var(--ink)}
.btn.small{padding:7px 12px;border-radius:11px;font-size:13px}
.hint{font-size:12.5px;color:var(--ink-soft);margin:0}
.err{font-size:13px;color:var(--danger);margin:0}

#result{margin:16px 22px 0;padding:14px 16px;border-radius:16px;background:var(--panel-2);display:flex;flex-direction:column;gap:6px}
#result .ep{font-size:12px;color:var(--ink-soft);letter-spacing:.06em}
#result .change{font-weight:700;font-size:16px}
.mile{align-self:flex-start;font-size:13px;font-weight:700;background:color-mix(in srgb,var(--accent) 24%,transparent);padding:3px 11px;border-radius:999px}
#result .reply{font-family:var(--f-display);font-size:16px;color:var(--leaf)}
#result .row{justify-content:space-between}

.log{padding:18px 22px 8px;flex:1}
.log h2{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ink-soft);margin:0 0 10px}
#entries{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
#entries button{width:100%;text-align:left;border:0;background:transparent;border-radius:14px;padding:10px 12px;
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px}
#entries button:hover{background:var(--panel-2)}
#entries .d{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;grid-row:span 4;padding-top:2px;text-align:center;line-height:1.3}
#entries .d b{display:block;font-size:18px;color:var(--ink);font-weight:700}
#entries .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0;font-size:14px}
#entries .c{font-size:12.5px;font-weight:700;color:var(--leaf);display:flex;gap:6px;align-items:center}
#entries .ms{color:var(--ink);font-weight:500}
#entries .c i{width:8px;height:8px;border-radius:50%;background:var(--m)}
.empty{font-size:13.5px;color:var(--ink-soft);padding:14px;border-radius:14px;border:1.5px dashed var(--line)}
.examples{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px;color:var(--ink-soft);margin-top:10px}
.examples b{color:var(--ink);font-weight:500}

.p-foot{padding:12px 22px 18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line)}
.p-foot .store{font-size:12px;color:var(--ink-soft);flex-basis:100%}

/* creator */
#creator{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;
  background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(5px);overflow:auto}
.card{background:var(--panel);border-radius:26px;width:min(760px,100%);box-shadow:0 30px 80px -30px rgba(20,20,60,.45),inset 0 0 0 1px var(--line);
  display:grid;grid-template-columns:240px minmax(0,1fr);overflow:hidden;max-height:calc(100% - 8px)}
.card .pv{background:linear-gradient(180deg,#cfe6fb,#f7efd9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:20px}
.card .pv canvas{width:200px;height:230px;max-width:100%}
.card .pv .nm{font-family:var(--f-display);font-size:22px;color:#2b2945}
.card .fields{padding:22px 24px;display:flex;flex-direction:column;gap:14px;overflow:auto;min-width:0}
.card h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;line-height:1.2}
.card p.lead{margin:-6px 0 0;font-size:13.5px;color:var(--ink-soft)}
.f{display:flex;flex-direction:column;gap:6px}
.f input[type=text]{border:1.5px solid var(--line);background:var(--panel-2);border-radius:12px;padding:8px 12px;width:100%}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--c)}
.sw[aria-checked="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--panel) inset}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:13.5px}
.chip[aria-checked="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 20%,transparent);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

@media (max-width:860px){
  html,body{height:auto}
  #app{display:flex;flex-direction:column;height:auto;padding-block:12px}
  #stage{height:min(64svh,560px);min-height:360px}
  #panel{overflow:visible}
  .card{grid-template-columns:1fr}
  .card .pv{padding:14px}
  .card .pv canvas{width:150px;height:172px}
  .two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){ #toast{animation:none} }
</style>
</head>
<body>


<div id="app">
  <section id="stage" aria-label="箱庭">
    <canvas id="world"></canvas>
    <div class="hud"><span class="town" id="hudTown">はじまりの町</span><span class="meta" id="hudMeta">読み込み中…</span><span class="meta hint2">建物をタップすると中が見られます</span></div>
    <div class="zoom">
      <button id="zin" aria-label="拡大">＋</button>
      <button id="zout" aria-label="縮小">－</button>
      <button id="zfit">全体</button>
    </div>
    <div id="toast" hidden></div>
    <div id="room" hidden>
      <div class="room-head"><span class="town" id="roomTitle">部屋の中</span><span class="meta" id="roomMeta"></span></div>
      <div class="room-actions"><button class="rbtn" id="roomCall" type="button">だれかを呼ぶ</button><button class="rbtn dark" id="roomClose" type="button">外に出る</button></div>
    </div>
  </section>

  <aside id="panel">
    <div class="p-head">
      <div>
        <h1>もうひとりの箱庭</h1>
        <div class="sub" id="subLine">日記を書くたび、町がひとつ変わる</div>
      </div>
      <button id="avatarChip" aria-label="アバターを編集"><canvas id="chipCv" width="104" height="120"></canvas></button>
    </div>

    <form id="diary" autocomplete="off">
      <label class="lbl" for="text">きょうのできごと</label>
      <textarea id="text" placeholder="例：美容院で髪をばっさり切った。首元が軽くて気分がいい"></textarea>
      <span class="lbl" id="moodLbl">きもち</span>
      <div class="moods" id="moods" role="radiogroup" aria-labelledby="moodLbl"></div>
      <p class="err" id="formErr" hidden></p>
      <div class="row">
        <button class="btn" id="submit" type="submit">箱庭に書く</button>
        <span class="hint" id="aiNote">行為と気分から、町かアバターが1つ変わります</span>
      </div>
    </form>

    <div id="result" hidden>
      <span class="ep" id="rEp"></span>
      <span class="change" id="rChange"></span>
      <span class="mile" id="rMile" hidden></span>
      <span class="reply" id="rReply"></span>
      <div class="row"><span class="hint" id="rVia"></span><button class="btn ghost small" id="undo" type="button">この日記を取り消す</button></div>
    </div>

    <section class="log">
      <h2>これまでのエピソード</h2>
      <ol id="entries"></ol>
    </section>

    <div class="p-foot">
      <button class="btn ghost small" id="editAvatar" type="button">アバターを着がえる</button>
      <button class="btn ghost small" id="reset" type="button">はじめからやり直す</button>
      <span class="store" id="storeNote"></span>
    </div>
  </aside>
</div>

<div id="creator" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="crTitle">
    <div class="pv"><canvas id="pvCv" width="400" height="460"></canvas><span class="nm" id="pvName">わたし</span></div>
    <div class="fields">
      <h2 id="crTitle">もうひとりの自分をつくる</h2>
      <p class="lead" id="crLead">この子があなたの写し。日記を書くたびに、この子と町が育っていきます。</p>
      <div class="two">
        <div class="f"><label class="lbl" for="cName">なまえ</label><input type="text" id="cName" maxlength="10" value="わたし"></div>
        <div class="f"><label class="lbl" for="cTown">町のなまえ</label><input type="text" id="cTown" maxlength="12" value="はじまりの町"></div>
      </div>
      <div class="f"><span class="lbl">はだ</span><div class="opts" id="oSkin" role="radiogroup" aria-label="はだの色"></div></div>
      <div class="f"><span class="lbl">かみがた</span><div class="opts" id="oHair" role="radiogroup" aria-label="かみがた"></div></div>
      <div class="f"><span class="lbl">かみのいろ</span><div class="opts" id="oHairC" role="radiogroup" aria-label="かみのいろ"></div></div>
      <div class="f"><span class="lbl">ふく</span><div class="opts" id="oTop" role="radiogroup" aria-label="ふくの色"></div></div>
      <div class="f"><span class="lbl">ボトム</span><div class="opts" id="oBot" role="radiogroup" aria-label="ボトムの色"></div></div>
      <div class="f"><span class="lbl">こもの</span><div class="opts" id="oAcc" role="radiogroup" aria-label="こもの"></div></div>
      <div class="row"><button class="btn" id="crDone" type="button">この姿で暮らしはじめる</button><button class="btn ghost" id="crCancel" type="button" hidden>やめる</button></div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- palettes ---------------- */
const SKIN = {light:'#fde6d3', fair:'#f5cfae', tan:'#dca57a', deep:'#a86f4a'};
const HAIRC = {black:'#2f2835', brown:'#7b4a2c', blonde:'#e9c46a', pink:'#f19ab4', blue:'#6b8fd9', silver:'#cdd0da', red:'#c95a3e'};
const HAIRC_JA = {black:'くろ', brown:'ちゃいろ', blonde:'きんいろ', pink:'ピンク', blue:'あお', silver:'ぎんいろ', red:'あか'};
const HAIRS = {short:'ショート', bob:'ボブ', long:'ロング', wave:'ゆるふわロング', bun:'おだんご', pony:'ポニーテール', twin:'ツインテール', braid:'みつあみ', perm:'もこもこパーマ', spiky:'ツンツン', buzz:'ぼうず'};
const OUTFIT = {red:'#e8685a', blue:'#5b8ed7', green:'#66b36a', yellow:'#f2c14e', purple:'#a07bd1', white:'#f5f3ee', black:'#3a3646', orange:'#f09a4a', pink:'#f1a2c0', mint:'#7dd0b7'};
const OUTFIT_JA = {red:'あか', blue:'あお', green:'みどり', yellow:'きいろ', purple:'むらさき', white:'しろ', black:'くろ', orange:'オレンジ', pink:'ピンク', mint:'ミント'};
const BOTTOM = {navy:'#394a78', denim:'#5d7fb3', brown:'#8a6040', gray:'#6e6b78', cream:'#e8dcc3'};
const ACC = {none:'なし', glasses:'メガネ', hat:'ぼうし', ribbon:'リボン'};
const MOODS = [
  {k:'うれしい',c:'#f2bf3c'},{k:'たのしい',c:'#f08a5d'},{k:'おだやか',c:'#62bd97'},{k:'ドキドキ',c:'#e8708f'},
  {k:'つかれた',c:'#948dc8'},{k:'かなしい',c:'#6a95d0'},{k:'もやもや',c:'#a39e94'}];
const MOODC = Object.fromEntries(MOODS.map(m=>[m.k,m.c]));
const SKY = {
  '':['#cde6fd','#fbf1dc'], 'うれしい':['#bde1ff','#fff0c0'], 'たのしい':['#ffd8c6','#fff4d8'], 'おだやか':['#cfeee2','#f3f9ee'],
  'ドキドキ':['#ffd2df','#fdecf2'], 'つかれた':['#dad6ef','#f2eff8'], 'かなしい':['#c3cfdf','#e5eaf1'], 'もやもや':['#d9d7d1','#eeede8']};

/* ---------------- actions ---------------- */
const ACTIONS = [
  {id:'resident', desc:'住人を1人増やす（友達ができた・誰かと出会った・仲良くなった）'},
  {id:'pet', desc:'動物が住みつく（犬や猫、動物とふれあった）'},
  {id:'hair', desc:'アバターの髪型や髪色を変える（髪を切った・染めた・伸ばした・結んだ）'},
  {id:'outfit', desc:'アバターの服の色を変える（服を買った・着がえた・おしゃれした）'},
  {id:'accessory', desc:'アバターの小物を変える（メガネ・帽子・リボン）'},
  {id:'nature', desc:'自然エリア（森と草原）を開放して土地が広がる（リラックスできた・自然にふれた・散歩）'},
  {id:'flowers', desc:'花壇が咲く（うれしい・感謝・ほめられた）'},
  {id:'tree', desc:'木を1本植える（努力・継続・成長した）'},
  {id:'house', desc:'家が1軒建つ（家族・引っ越し・安心・帰る場所）'},
  {id:'cafe', desc:'カフェができる（おいしいものを食べた・誰かとお茶した）'},
  {id:'library', desc:'図書館ができる（勉強した・本を読んだ・学んだ）'},
  {id:'pond', desc:'池がわく（お風呂・温泉・海・水辺・ひと息ついた）'},
  {id:'fountain', desc:'広場に噴水ができる（大きな達成・合格・お祝い）'},
  {id:'lamp', desc:'街灯がともる（不安・さみしさ・夜・かなしい気持ちに寄りそう灯り）'},
  {id:'bench', desc:'ベンチを置く（疲れた・休んだ・ぼーっとした）'},
  {id:'garden', desc:'畑ができる（料理した・自炊・健康に気をつけた・運動）'},
  {id:'path', desc:'小道がのびる（一歩前進した・新しいことを始めた）'},
  {id:'expand', desc:'土地が広がる（挑戦した・世界が広がった・遠くへ出かけた）'},
  {id:'mushroom', desc:'キノコが生える（雨・もやもや・なんとなくの日）'},
  {id:'windmill', desc:'風車が建つ（旅行・遠出・風を感じた・気分転換）'},
];
const ACTION_IDS = ACTIONS.map(a=>a.id);
const LABEL = {
  resident:p=>`住人${p.name?`「${p.name}」`:''}がひとり増えた`,
  pet:p=>p.kind==='dog'?'犬が町に住みついた':'猫が町に住みついた',
  hair:p=>p.color&&p.style?`${HAIRS[p.style]}の${HAIRC_JA[p.color]}髪になった`:p.color?`髪が${HAIRC_JA[p.color]}になった`:`髪型が${HAIRS[p.style]}になった`,
  outfit:p=>`服が${OUTFIT_JA[p.color]}になった`,
  accessory:p=>p.item==='none'?'小物を外した':`${ACC[p.item]}をつけた`,
  nature:()=>'自然エリアが開放された', flowers:()=>'花壇が咲いた', tree:()=>'木が1本育った',
  house:()=>'家が1軒建った', cafe:()=>'カフェがひらいた', library:()=>'図書館ができた', pond:()=>'池がわいた',
  fountain:()=>'広場に噴水ができた', lamp:()=>'街灯がともった', bench:()=>'ベンチを置いた', garden:()=>'畑ができた',
  path:()=>'小道がのびた', expand:()=>'土地が広がった', mushroom:()=>'キノコが生えた', windmill:()=>'風車が建った',
};

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const hh=(x,y,n=0)=>{const v=Math.sin(x*127.1+y*311.7+n*74.7)*43758.5453;return v-Math.floor(v)};
const K=(x,y)=>x+','+y;

function rgbOf(c){ if(c[0]==='#'){ const n=parseInt(c.slice(1),16); return [n>>16,n>>8&255,n&255]; } const m=c.match(/[\d.]+/g)||[0,0,0]; return [+m[0],+m[1],+m[2]]; }
function shade(hex,amt){let [r,g,b]=rgbOf(hex);
  if(amt<0){r*=1+amt;g*=1+amt;b*=1+amt}else{r+=(255-r)*amt;g+=(255-g)*amt;b+=(255-b)*amt}
  return `rgb(${r|0},${g|0},${b|0})`}
function mix(a,b,t){const A=rgbOf(a),B=rgbOf(b); const f=i=>Math.round(A[i]*(1-t)+B[i]*t); return `rgb(${f(0)},${f(1)},${f(2)})`}

const DEFAULT_AVATAR = {name:'わたし', skin:'fair', hair:'bob', hairColor:'brown', outfit:'mint', bottom:'navy', acc:'none', seed:1.3};
function newTown(avatar, townName){
  const tiles={};
  for(let x=0;x<5;x++)for(let y=0;y<5;y++){ if((x===0&&y===4)||(x===4&&y===0))continue; tiles[K(x,y)]='g'; }
  tiles[K(1,2)]='p'; tiles[K(2,2)]='p'; tiles[K(2,3)]='p';
  return {v:1, created:new Date().toISOString(), townName:townName||'はじまりの町', avatar:{...avatar},
    tiles, objects:[{id:'home',kind:'home',x:1,y:1},{id:'o0',kind:'tree',x:3,y:1,variant:'round'},{id:'o1',kind:'tree',x:0,y:3,variant:'pine'}],

}

function readLocal(){ try{ const s=localStorage.getItem(LS_KEY); return s?JSON.parse(s):null }catch(e){return null} }
function writeLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({town:S, entries:E})) }catch(e){} }
function clearLocal(){ try{ localStorage.removeItem(LS_KEY) }catch(e){} }
const withTimeout=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))]);
let sampleFn = null;

async function initStorage(){
  if(!window.claude || typeof window.claude.use!=='function') return;
  window.claude.use('sample').then(s=>{ sampleFn=s||null; updateAiNote(); }).catch(()=>{});
  try{
    const both = await withTimeout(Promise.all([window.claude.use('db'), window.claude.use('user')]), 9000);
    if(!both) return;
    const [db,user]=both;
    if(!db||!user) return;
    const id = await user.id();
    if(!id) return;
    store.townRef = db.doc('data/users/'+id+'/town');
    store.entriesCol = store.townRef.collection('entries');
    store.mode='cloud';
  }catch(e){ store.mode='local'; }
}
async function loadAll(){
  const local = readLocal();
  if(store.mode==='cloud'){
    try{
      const snap = await store.townRef.get();
      if(snap.exists){
        const town = clone(snap.data());
        const qs = await store.entriesCol.get();
        const entries = qs.docs.map(d=>clone(d.data())).sort((a,b)=>a.date<b.date?-1:1);
        return {town, entries};
      }
      if(local && local.town){ // move this browser's data into private storage
        S=local.town; E=local.entries||[];
        await store.townRef.set(S);
        for(const e of E) await store.entriesCol.doc(e.id).set(e);
        return local;
      }
      return null;
    }catch(e){ store.mode='local'; }
  }
  return local && local.town ? local : null;
}
async function saveTown(){
  writeLocal();
  if(store.mode!=='cloud') return;
  store.dirty=true;
  if(store.saving) return;
  store.saving=true;
  try{

    setStoreNote();

/* ---------------- world helpers ---------------- */
const BLOCK = new Set(['home','house','cafe','library','windmill','fountain','tree','lamp','bench','sign']);
function occMap(){ const m=new Map(); for(const o of S.objects) m.set(K(o.x,o.y),o); return m; }
function walkable(x,y,occ){ const t=S.tiles[K(x,y)]; if(!t||t==='w')return false; const o=occ.get(K(x,y)); return !(o&&BLOCK.has(o.kind)); }
function freeTiles(types=['g','m']){
  const occ=occMap(); const out=[];
  for(const key in S.tiles){ if(!types.includes(S.tiles[key]))continue; if(occ.has(key))continue;
    const [x,y]=key.split(',').map(Number); out.push({x,y}); }
  return out;
}
const N4=[[1,0],[-1,0],[0,1],[0,-1]];
function center(){ let sx=0,sy=0,n=0; for(const k in S.tiles){const [x,y]=k.split(',').map(Number);sx+=x;sy+=y;n++} return {x:sx/n,y:sy/n}; }
function expandLand(n,type,rng){
  const frontier=[];
  for(const k in S.tiles){ const [x,y]=k.split(',').map(Number);
    for(const [dx,dy] of N4){ const kk=K(x+dx,y+dy); if(!S.tiles[kk]) frontier.push([x+dx,y+dy]); } }
  if(!frontier.length) return [];
  const seed=pick(rng,frontier); const added=[]; const set=new Set();
  const add=(x,y)=>{S.tiles[K(x,y)]=type;added.push({x,y});set.add(K(x,y))};
  add(seed[0],seed[1]);
  while(added.length<n){
    const cand=[];
    for(const a of added) for(const [dx,dy] of N4){ const x=a.x+dx,y=a.y+dy,kk=K(x,y); if(S.tiles[kk])continue;
      let score=0; for(const [ex,ey] of N4) if(S.tiles[K(x+ex,y+ey)]) score++;
      cand.push({x,y,score:score+rng()*1.2}); }
    if(!cand.length)break;
    cand.sort((a,b)=>b.score-a.score); const c=cand[0]; add(c.x,c.y);
  }
  return added;
}
function takeFree(rng,{types=['g','m'],prefer}={}){
  let f=freeTiles(types);
  if(!f.length){ expandLand(6,'g',rng); f=freeTiles(types); }
  if(!f.length) return null;
  if(prefer){ f=f.map(t=>({...t,s:prefer(t)+rng()*0.8})).sort((a,b)=>b.s-a.s); return f[0]; }
  return pick(rng,f);
}
function nearPath(t){ let s=0; for(const [dx,dy] of N4) if(S.tiles[K(t.x+dx,t.y+dy)]==='p') s+=1; return s; }
function edgeScore(t){ let s=0; for(const [dx,dy] of N4) if(!S.tiles[K(t.x+dx,t.y+dy)]) s+=1; return s; }
function addObj(kind,t,extra={}){ const o={id:'o'+S.seed+'_'+Math.floor(Math.random()*1e5),kind,x:t.x,y:t.y,...extra}; S.objects.push(o); born.set(o.id,now()); return o; }
function randomLook(r){ return {skin:pick(r,Object.keys(SKIN)), hair:pick(r,Object.keys(HAIRS)), hairColor:pick(r,Object.keys(HAIRC)),
  outfit:pick(r,Object.keys(OUTFIT)), bottom:pick(r,Object.keys(BOTTOM)), acc:r()<0.3?pick(r,['glasses','hat','ribbon']):'none', seed:r()*9}; }

function applyAction(action,params,rng,mood){
  const tc=t=>t?{x:t.x+0.5,y:t.y+0.5}:null;
  const a=S.avatar;
  switch(action){
    case 'resident':{ const t=takeFree(rng,{types:['g','m','p'],prefer:nearPath});
      const r={id:'r'+Date.now().toString(36), name:params.name||'', look:randomLook(rng), x:t.x+0.5, y:t.y+0.5};
      S.residents.push(r); return {target:tc(t), newResident:r.id}; }
    case 'pet':{ const t=takeFree(rng,{types:['g','m','p']});
      const kind=params.kind==='dog'?'dog':'cat';
      const col = kind==='cat'?pick(rng,['#f2b36b','#6f6b7c','#f4efe4','#3a3542']):pick(rng,['#c98b52','#f0dcc0','#5a4636','#e9b77c']);
      const p={id:'p'+Date.now().toString(36), kind, color:col, x:t.x+0.5, y:t.y+0.5}; S.pets.push(p); return {target:tc(t), newPet:p.id}; }
    case 'hair':{ if(params.style) a.hair=params.style; if(params.color) a.hairColor=params.color; return {target:null, avatar:true}; }
    case 'outfit':{ a.outfit=params.color; return {target:null, avatar:true}; }
    case 'accessory':{ a.acc=params.item; return {target:null, avatar:true}; }
    case 'nature':{ const added=expandLand(9,'m',rng); S.natureCount=(S.natureCount||0)+1;
      const spots=[...added].sort(()=>rng()-0.5);
      const kinds=['round','pine','round','blossom','fruit'];
      for(let i=0;i<3&&i<spots.length;i++) addObj('tree',spots[i],{variant:pick(rng,kinds)});
      if(spots[3]) addObj('flowers',spots[3],{variant:Math.floor(rng()*4)});
      const c=added.reduce((s,t)=>({x:s.x+t.x/added.length,y:s.y+t.y/added.length}),{x:0,y:0});
      return {target:{x:c.x+0.5,y:c.y+0.5}}; }
    case 'flowers':{ const t=takeFree(rng,{types:['g','m'],prefer:t=>nearPath(t)*0.6}); addObj('flowers',t,{variant:Math.floor(rng()*4)}); return {target:tc(t)}; }
    case 'tree':{ const t=takeFree(rng,{prefer:edgeScore}); const v= mood==='うれしい'||mood==='たのしい'?pick(rng,['blossom','fruit']):pick(rng,['round','pine','round','fruit']);
      addObj('tree',t,{variant:v}); return {target:tc(t)}; }
    case 'house': case 'cafe': case 'library': case 'windmill': case 'fountain':{
      const pref = action==='windmill'? edgeScore : (t=>nearPath(t)*1.5 - edgeScore(t)*0.3);
      const t=takeFree(rng,{types:['g','m'],prefer:pref});
      const variant = action==='house'?Math.floor(rng()*4):0;
      addObj(action,t,{variant}); return {target:tc(t)}; }
    case 'lamp': case 'bench': case 'mushroom':{ const t=takeFree(rng,{types:['g','m'],prefer:action==='mushroom'?edgeScore:nearPath}); addObj(action,t); return {target:tc(t)}; }
    case 'pond':{ let f=freeTiles(['g','m']); if(f.length<4){ expandLand(6,'g',rng); f=freeTiles(['g','m']); }
      const fs=new Set(f.map(t=>K(t.x,t.y)));
      const start=pick(rng,f.sort((a,b)=>edgeScore(b)-edgeScore(a)).slice(0,Math.max(3,Math.floor(f.length/2))));
      const cl=[start]; fs.delete(K(start.x,start.y));
      while(cl.length<3){ const nb=[]; for(const c of cl) for(const [dx,dy] of N4){const kk=K(c.x+dx,c.y+dy); if(fs.has(kk))nb.push({x:c.x+dx,y:c.y+dy});}
        if(!nb.length)break; const n=pick(rng,nb); fs.delete(K(n.x,n.y)); cl.push(n); }
      for(const c of cl) S.tiles[K(c.x,c.y)]='w';
      addObj('lily',cl[cl.length-1]);
      const cx=cl.reduce((s,t)=>s+t.x,0)/cl.length, cy=cl.reduce((s,t)=>s+t.y,0)/cl.length;
      return {target:{x:cx+0.5,y:cy+0.5}}; }
    case 'garden':{ const t=takeFree(rng,{types:['g'],prefer:nearPath}); S.tiles[K(t.x,t.y)]='s'; addObj('crops',t,{variant:Math.floor(rng()*3)});
      const occ=occMap(); const nb=N4.map(([dx,dy])=>({x:t.x+dx,y:t.y+dy})).filter(n=>S.tiles[K(n.x,n.y)]==='g'&&!occ.has(K(n.x,n.y)));
      if(nb.length){ const n=pick(rng,nb); S.tiles[K(n.x,n.y)]='s'; addObj('crops',n,{variant:Math.floor(rng()*3)}); }
      return {target:tc(t)}; }
    case 'path':{ const occ=occMap(); const paths=Object.keys(S.tiles).filter(k=>S.tiles[k]==='p').map(k=>k.split(',').map(Number));
      const ok=(x,y)=>S.tiles[K(x,y)]==='g'&&!occ.has(K(x,y));
      let starts=[]; for(const [x,y] of paths) for(const [dx,dy] of N4) if(ok(x+dx,y+dy)) starts.push([x,y,dx,dy]);
      if(!starts.length){ expandLand(5,'g',rng); for(const [x,y] of paths) for(const [dx,dy] of N4) if(ok(x+dx,y+dy)) starts.push([x,y,dx,dy]); }
      if(!starts.length){ const t=takeFree(rng,{types:['g']}); if(t){S.tiles[K(t.x,t.y)]='p'; return {target:tc(t)};} return {target:null}; }
      let [x,y,dx,dy]=pick(rng,starts); const done=[];
      for(let i=0;i<4;i++){ if(ok(x+dx,y+dy)){ x+=dx;y+=dy; S.tiles[K(x,y)]='p'; done.push({x,y}); if(rng()<0.3){ const d=pick(rng,N4); if(!(d[0]===-dx&&d[1]===-dy)){dx=d[0];dy=d[1];} } }
        else { const alt=N4.filter(([ex,ey])=>ok(x+ex,y+ey)); if(!alt.length)break; [dx,dy]=pick(rng,alt); i--; if(done.length>6)break; } }
      const last=done[done.length-1]||{x,y}; return {target:tc(last)}; }
    case 'expand':{ const added=expandLand(10,'g',rng); const c=added.reduce((s,t)=>({x:s.x+t.x/added.length,y:s.y+t.y/added.length}),{x:0,y:0});
      return {target:{x:c.x+0.5,y:c.y+0.5}}; }
  }
  return {target:null};
}

const MOOD_DEFAULT = {'うれしい':'flowers','たのしい':'flowers','おだやか':'nature','ドキドキ':'path','つかれた':'bench','かなしい':'lamp','もやもや':'mushroom'};
function ruleInterpret(text,mood){
  for(const [re,fn] of RULES) if(re.test(text)) return fn(text);
  const a = MOOD_DEFAULT[mood] || pick(Math.random,['flowers','tree','expand','path']);
  return {action:a,params:{}};
}
function sanitize(d){
  if(!d||typeof d!=='object') return null;
  const a=String(d.action||''); if(!ACTION_IDS.includes(a)) return null;
  const p=(d.params&&typeof d.params==='object')?d.params:{}; const o={};
  if(a==='resident') o.name=String(p.name||'').replace(/[<>"'`]/g,'').slice(0,8);
  if(a==='pet') o.kind=p.kind==='dog'?'dog':'cat';
  if(a==='hair'){ if(HAIRS[p.style]) o.style=p.style; if(HAIRC[p.color]&&p.color!==S.avatar.hairColor) o.color=p.color; if(!o.style&&!o.color) o.style=S.avatar.hair==='short'?'bob':'short'; }
  if(a==='outfit'){ o.color=OUTFIT[p.color]?p.color:Object.keys(OUTFIT).find(c=>c!==S.avatar.outfit); }
  if(a==='accessory'){ o.item=ACC[p.item]?p.item:'glasses'; }
  const reply=String(d.reply||'').replace(/[\r\n]+/g,' ').slice(0,40);
  return {action:a,params:o,reply};
}

const walkers = new Map();
function now(){ return performance.now()/1000; }
const born = new Map();
function makeWalker(id,kind,x,y,extra){ return {id,kind,x,y,path:[],wait:Math.random()*2,dirX:1,back:false,moving:false,speed:kind==='pet'?1.25:0.95,bubble:null,
  mode:'wander',goal:null,act:null,actUntil:0,emote:null,hidden:false,meetCd:now()+8+Math.random()*10,ret:null,...extra}; }
function resetWalker(w){ if(w.ret){w.x=w.ret.x;w.y=w.ret.y;w.ret=null;} w.insideId=null; w.path=[]; w.mode='wander'; w.goal=null; w.act=null; w.hidden=false; w.wait=0; }
function syncWalkers(){
  if(!walkers.has('me')) walkers.set('me',makeWalker('me','person',2.5,2.5,{}));
  walkers.get('me').look=S.avatar;
  const ids=new Set(['me']);
  for(const r of S.residents){ ids.add(r.id); if(!walkers.has(r.id)) walkers.set(r.id,makeWalker(r.id,'person',r.x,r.y,{})); walkers.get(r.id).look=r.look; }
  for(const p of S.pets){ ids.add(p.id); if(!walkers.has(p.id)) walkers.set(p.id,makeWalker(p.id,'pet',p.x,p.y,{})); Object.assign(walkers.get(p.id),{pet:p.kind,color:p.color}); }
  for(const id of [...walkers.keys()]) if(!ids.has(id)) walkers.delete(id);
  for(const w of walkers.values()){ resetWalker(w); if(!S.tiles[K(Math.floor(w.x),Math.floor(w.y))]){ const f=freeTiles(['g','m','p'])[0]; if(f){w.x=f.x+0.5;w.y=f.y+0.5;} } }
}
function bfs(sx,sy,occ,maxD){
  const prev=new Map([[K(sx,sy),null]]), dist=new Map([[K(sx,sy),0]]); const q=[[sx,sy]];
  while(q.length){ const [x,y]=q.shift(); const d=dist.get(K(x,y)); if(d>=maxD)continue;
    for(const [dx,dy] of N4){ const nx=x+dx,ny=y+dy,kk=K(nx,ny); if(prev.has(kk)||!walkable(nx,ny,occ))continue; prev.set(kk,K(x,y)); dist.set(kk,d+1); q.push([nx,ny]); } }
  return {prev,dist};
}
function tracePath(prev,sx,sy,tx,ty,jit){
  let cur=K(tx,ty); if(!prev.has(cur)) return null; const path=[];
  while(cur && cur!==K(sx,sy)){ const [x,y]=cur.split(',').map(Number); path.unshift({x:x+0.5+(Math.random()-0.5)*jit,y:y+0.5+(Math.random()-0.5)*jit}); cur=prev.get(cur); }
  return path;
}
function planPath(w,occ){
  const sx=Math.floor(w.x),sy=Math.floor(w.y); const {prev,dist}=bfs(sx,sy,occ,10);
  const reach=[...dist].filter(([,d])=>d>=2).map(([k])=>k.split(',').map(Number));
  if(!reach.length) return [];
  const [tx,ty]=reach[Math.floor(Math.random()*reach.length)];
  return tracePath(prev,sx,sy,tx,ty,0.3)||[];
}
function pathTo(w,tx,ty,occ){ const sx=Math.floor(w.x),sy=Math.floor(w.y); if(sx===tx&&sy===ty) return []; const {prev}=bfs(sx,sy,occ,26); return tracePath(prev,sx,sy,tx,ty,0.16); }
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
function standTiles(o,occ){
  if(!BLOCK.has(o.kind) && walkable(o.x,o.y,occ)) return [[o.x,o.y]];
  const order=['home','house','cafe','library'].includes(o.kind)?[[0,1],[1,0],[-1,0],[0,-1]]:shuffle(N4);
  return order.map(([dx,dy])=>[o.x+dx,o.y+dy]).filter(([x,y])=>walkable(x,y,occ));
}
function nearestFree(c,occ,taken){ let best=null,bd=1e9; const cx=Math.floor(c.x),cy=Math.floor(c.y);
  for(let dx=-3;dx<=3;dx++)for(let dy=-3;dy<=3;dy++){ const x=cx+dx,y=cy+dy; if(taken.has(K(x,y))||!walkable(x,y,occ))continue;
    const d=Math.hypot(x+0.5-c.x,y+0.5-c.y)+Math.random()*0.35; if(d<bd){bd=d;best=[x,y];} }
  return best; }

  pet:'かわいい〜',hair:'似合ってる！',outfit:'その服いいね',accessory:'いい感じ！',resident:'ようこそ！'};
function chooseNext(w,occ){
  if(w.kind==='pet'){
    const people=[...walkers.values()].filter(x=>x.kind==='person'&&!x.hidden);
    if(people.length&&Math.random()<0.5){ const tg=people[Math.floor(Math.random()*people.length)]; const sx=Math.floor(tg.x),sy=Math.floor(tg.y);
      for(const [x,y] of shuffle(N4.map(([dx,dy])=>[sx+dx,sy+dy])).filter(([x,y])=>walkable(x,y,occ))){ const p=pathTo(w,x,y,occ); if(p){ w.path=p; w.goal={act:'happy',emote:'heart',dur:2.5,face:tg}; return; } } }
    w.path=planPath(w,occ); return;
  }
  if(Math.random()<0.55){
    const opts=[];
    for(const o of S.objects){ const a=ACTS[o.kind]; if(!a)continue; let wt=typeof a.w==='function'?a.w():a.w;
      if(w.id==='me'&&a.act==='inside'&&!(o.kind==='home'&&isNight)) wt=0; if(wt>0) opts.push({o,a,wt}); }
    for(const p of walkers.values()) if(p.kind==='pet') opts.push({pet:p,wt:0.8});
    let total=0; for(const op of opts){ const ox=op.o?op.o.x+0.5:op.pet.x, oy=op.o?op.o.y+0.5:op.pet.y; op.wt/=1+Math.hypot(ox-w.x,oy-w.y)*0.3; total+=op.wt; }
    let r=Math.random()*total;
    for(const op of opts){ r-=op.wt; if(r>0)continue;
      if(op.pet){ const px=Math.floor(op.pet.x),py=Math.floor(op.pet.y);
        for(const [x,y] of shuffle(N4.map(([dx,dy])=>[px+dx,py+dy])).filter(([x,y])=>walkable(x,y,occ))){ const pp=pathTo(w,x,y,occ); if(pp){ w.path=pp; w.goal={act:'crouch',emote:'heart',dur:3.2,face:op.pet,petting:op.pet}; return; } }
        break; }
      for(const [x,y] of standTiles(op.o,occ)){ const pp=pathTo(w,x,y,occ); if(pp){ let a=op.a; if(['cafe','library','windmill'].includes(op.o.kind)&&Math.random()<0.6) a={...a,act:'inside',dur:[10,18],emote:null}; w.path=pp;
        w.goal={act:a.act,emote:typeof a.emote==='function'?a.emote(op.o):a.emote,dur:a.dur[0]+Math.random()*(a.dur[1]-a.dur[0]),obj:op.o,face:{x:op.o.x+0.5,y:op.o.y+0.5}}; return; } }
      break;
    }
  }
  w.path=planPath(w,occ);
}
function startAct(w,g){
  const t=now();
  w.mode='act'; w.act=g.act; w.actUntil=t+(g.dur||3); w.moving=false; w.path=[];
  if(g.face){ const sdx=(g.face.x-g.face.y)-(w.x-w.y); if(Math.abs(sdx)>0.05) w.dirX=sdx<0?-1:1; }
  if(g.emote) w.emote={type:g.emote,t0:t+(g.emoteDelay||0),until:t+Math.min(g.dur||3,3.4)};
  if(g.say) w.bubble={text:g.say,until:t+3.4};
  if(g.act==='inside'){ w.mode='inside'; w.hidden=true; w.insideId=g.obj?g.obj.id:null; if(room&&g.obj&&room.o.id===g.obj.id) w.actUntil+=20; }
  if(g.act==='sit'&&g.obj){ w.ret={x:w.x,y:w.y}; w.x=g.obj.x+0.56; w.y=g.obj.y+0.5; w.dirX=1; }
  if(g.petting&&walkers.has(g.petting.id)){ const p=g.petting; p.mode='act'; p.act='happy'; p.actUntil=w.actUntil; p.path=[]; p.goal=null; p.moving=false;
    p.emote={type:'heart',t0:t+0.7,until:w.actUntil}; const sdx=(w.x-w.y)-(p.x-p.y); p.dirX=sdx<0?-1:1; }
}
function endAct(w){ if(w.ret){ w.x=w.ret.x; w.y=w.ret.y; w.ret=null; } w.insideId=null; w.mode='wander'; w.act=null; w.hidden=false; w.wait=0.4+Math.random()*1.2; }
function meetings(t){
  const ps=[...walkers.values()].filter(w=>w.kind==='person'&&w.mode==='wander'&&!w.goal&&w.moving&&t>w.meetCd);
  for(let i=0;i<ps.length;i++) for(let j=i+1;j<ps.length;j++){ const a=ps[i],b=ps[j];
    if(Math.hypot(a.x-b.x,a.y-b.y)<0.8){ a.meetCd=b.meetCd=t+18+Math.random()*16;
      if(Math.random()<0.65){ const talk=!(a.bubble&&a.bubble.until>t);
        startAct(a,{act:'wave',dur:2.6,face:b,say:talk?GREET[Math.floor(Math.random()*GREET.length)]:null,emote:talk?null:'note'});
        startAct(b,{act:'wave',dur:2.6,face:a,emote:'note',emoteDelay:0.5}); }
      return; } }
}
/* send everyone to gather around a point */
function crowd(center,{act='cheer',say=[],meSay=null,emotes=['star'],includeMe=true,exclude=null,dur=[3,4.5]}={}){
  const occ=occMap(); const taken=new Set([K(Math.floor(center.x),Math.floor(center.y))]); let si=0; const t=now();
  const people=[...walkers.values()].filter(w=>w.kind==='person'&&w.id!==exclude&&(includeMe||w.id!=='me'))
    .sort((a,b)=>Math.hypot(a.x-center.x,a.y-center.y)-Math.hypot(b.x-center.x,b.y-center.y));
  for(const w of people){
    resetWalker(w);
    const spot=nearestFree(center,occ,taken); if(!spot) continue; taken.add(K(spot[0],spot[1]));
    const p=pathTo(w,spot[0],spot[1],occ); if(p===null) continue;
    w.path=p; w.wait=Math.random()*0.7;
    const s = w.id==='me' ? meSay : (si<say.length && !(w.bubble&&w.bubble.until>t) ? say[si++] : null);
    w.goal={act,dur:dur[0]+Math.random()*(dur[1]-dur[0]),emote:w.id==='me'?null:emotes[Math.floor(Math.random()*emotes.length)],say:s,face:center};
  }
  for(const w of walkers.values()) if(w.kind==='pet'){ resetWalker(w); const spot=nearestFree(center,occ,taken); if(!spot)continue;
    const p=pathTo(w,spot[0],spot[1],occ); if(p===null)continue; taken.add(K(spot[0],spot[1])); w.path=p; w.goal={act:'happy',dur:2.8,emote:'heart',face:center}; }
}
function react(action,res,pt){
  const me=walkers.get('me');
  if(res.avatar){ resetWalker(me); startAct(me,{act:'hop',dur:3.4,emote:'star'});
    crowd({x:me.x,y:me.y},{act:'cheer',say:[REACT[action]],emotes:['heart','star'],includeMe:false}); return; }
  if(action==='resident'){
    crowd(pt,{act:'wave',say:['ようこそ！','よろしくね'],emotes:['note','heart'],exclude:res.newResident});
    const w=walkers.get(res.newResident); if(w){ resetWalker(w); startAct(w,{act:'wave',dur:3.4,say:'はじめまして！'}); }
    return; }
  crowd(pt,{act:'cheer',say:[REACT[action]||'わあ！'],emotes:['ex','star','note','heart']});
}
function updateWalkers(dt){
  const occ=occMap(); const t=now();
  for(const w of walkers.values()){
    if(w.emote&&t>w.emote.until) w.emote=null;
    if(w.mode==='act'||w.mode==='inside'){ w.moving=false; if(t>=w.actUntil) endAct(w); continue; }
    if(w.wait>0){ w.wait-=dt; w.moving=false; continue; }
    if(!w.path.length){
      if(w.goal){ const g=w.goal; w.goal=null; startAct(w,g); continue; }
      chooseNext(w,occ);
      if(!w.path.length){ if(w.goal){ const g=w.goal; w.goal=null; startAct(w,g); } else w.wait=1+Math.random()*2; continue; }
    }
    const tg=w.path[0]; const dx=tg.x-w.x, dy=tg.y-w.y; const d=Math.hypot(dx,dy);
    const step=w.speed*(w.goal&&w.goal.act==='cheer'?1.35:1)*dt;
    if(d<=step){ w.x=tg.x; w.y=tg.y; w.path.shift(); if(!w.path.length) w.wait= w.goal?0:(w.id==='me'? 0.3+Math.random()*1.2 : 0.8+Math.random()*3); }
    else { w.x+=dx/d*step; w.y+=dy/d*step; }
    w.moving=true;
    const sdx=dx-dy;
    if(Math.abs(sdx)>0.01) w.dirX=sdx<0?-1:1;
    w.back=false;
  }
  meetings(t);
}

const MILESTONES=[3,5,8,12,16,20,25,30,40,50];
const DISTRICTS=['にぎわい広場','おとなり通り','みどりの丘','みなと通り','はなの坂','ほしの森','にじの谷','おおきな街','そらの原','ゆめの都'];
function nextMilestone(){ const done=S.milestones||[]; return MILESTONES.find(m=>!done.includes(m)); }
function checkMilestone(rng){
  S.milestones=S.milestones||[];
  const pop=S.residents.length;
  const m=MILESTONES.find(v=>pop>=v&&!S.milestones.includes(v)); if(!m) return null;
  S.milestones.push(m);
  const idx=MILESTONES.indexOf(m);
  const added=expandLand(12+idx*2,'g',rng);
  if(!added.length) return null;
  const spots=[...added].sort(()=>rng()-0.5); const ids=[];
  ids.push(addObj('sign',spots[0],{m}).id);
  if(spots[1]) ids.push(addObj('flowers',spots[1],{variant:Math.floor(rng()*4)}).id);
  if(spots[2]) ids.push(addObj('flowers',spots[2],{variant:Math.floor(rng()*4)}).id);
  if(spots[3]) ids.push(addObj('tree',spots[3],{variant:pick(rng,['round','blossom','fruit'])}).id);
  if(spots[4]&&idx%2===1) ids.push(addObj('lamp',spots[4]).id);
  return {m,name:DISTRICTS[idx]||'あたらしい土地',target:{x:spots[0].x+0.5,y:spots[0].y+0.5},ids};
}

function poly(pts,fill,stroke,lw=1){ ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]); ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();} if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.lineJoin='round';ctx.stroke();} }
function ell(x,y,rx,ry,fill,stroke,lw=1){ ctx.beginPath(); ctx.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),0,0,Math.PI*2); if(fill){ctx.fillStyle=fill;ctx.fill()} if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()} }
function circ(x,y,r,fill){ ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); ctx.fillStyle=fill; ctx.fill(); }
function rrect(x,y,w,h,r,fill,stroke,lw=1){ ctx.beginPath(); r=Math.min(r,w/2,h/2); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill()} if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()} }
function wind(x,y,t){ return (Math.sin(t*1.7-(x+y)*0.55)*0.62+Math.sin(t*0.63+x*0.31)*0.38)*(0.75+0.35*Math.sin(t*0.21))*windAmp; }

const TOP={g:'#a3d97c',m:'#86c56b',p:'#ecd9ae',s:'#a97a52',w:'#79c3e8'};
function drawTiles(t){
  const list=Object.keys(S.tiles).map(k=>{const [x,y]=k.split(',').map(Number);return {x,y,type:S.tiles[k]}}).sort((a,b)=>(a.x+a.y)-(b.x+b.y)||a.x-b.x);
  for(const {x,y,type} of list){
    const hasR=!!S.tiles[K(x+1,y)], hasL=!!S.tiles[K(x,y+1)];
    const band = type==='w'?'#5aa9d4':type==='p'?'#cdb88a':type==='s'?'#8c6240':'#6fb357';
    if(!hasR){ poly([P(x+1,y),P(x+1,y+1),P(x+1,y+1,-DEPTH),P(x+1,y,-DEPTH)],'#b07f55');
      poly([P(x+1,y),P(x+1,y+1),P(x+1,y+1,-4),P(x+1,y,-4)],band);
      const a=P(x+1,y+0.35,-11),b=P(x+1,y+0.75,-15); circ(a[0],a[1],1.6,'#946a45'); circ(b[0],b[1],1.2,'#c89a6d'); }
    if(!hasL){ poly([P(x,y+1),P(x+1,y+1),P(x+1,y+1,-DEPTH),P(x,y+1,-DEPTH)],'#94683f');
      poly([P(x,y+1),P(x+1,y+1),P(x+1,y+1,-4),P(x,y+1,-4)],shade(band.startsWith('#')?band:'#6fb357',-0.12));
      const a=P(x+0.4,y+1,-12); circ(a[0],a[1],1.5,'#7d5634'); }
    let top=TOP[type];
    const v=hh(x,y); if(type==='g'||type==='m') top=mix(top, v>0.5?'#c2e89a':'#8fcf6c', 0.18*Math.abs(v-0.5)*2);
    poly([P(x,y),P(x+1,y),P(x+1,y+1),P(x,y+1)],top);
    if(type==='w'){ // bank + shimmer

  for(let i=E.length-1;i>=0;i--){ const e=E[i]; const f=fmtDate(e.date);
    const li=document.createElement('li'); const b=document.createElement('button'); b.type='button';
    b.innerHTML=`<span class="d"><b>${f.d}</b>${f.m}月·${f.w}</span><span class="t"></span><span class="c" style="--m:${MOODC[e.mood]||'var(--line)'}"><i></i><span></span></span>`;
    b.querySelector('.t').textContent=e.text||`（${e.mood}な一日）`;
    b.querySelector('.c span').textContent=`第${i+1}話 → ${e.label}`;
    if(e.milestone){ const ms=document.createElement('span'); ms.className='c ms'; ms.textContent=`＋ 住人${e.milestone.m}人で「${e.milestone.name}」がひらけた`; b.appendChild(ms); }
    b.onclick=()=>{ const pt=e.target||(()=>{const w=walkers.get('me');return {x:w.x,y:w.y}})(); focusOn(pt); celebrate(pt); if(W<500||innerWidth<860) $('#stage').scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'start'}); };
    li.appendChild(b); ol.appendChild(li); }
}
let toastTm;
function toast(msg){ const el=$('#toast'); el.hidden=true; void el.offsetWidth; el.textContent=msg; el.hidden=false; clearTimeout(toastTm); toastTm=setTimeout(()=>el.hidden=true,5200); }

let undoInfo=null, msTimer=null;
$('#diary').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const text=$('#text').value.trim();
  const err=$('#formErr');
  if(!text&&!mood){ err.textContent='できごとを書くか、きもちを1つ選んでください'; err.hidden=false; return; }
  err.hidden=true;
  closeRoom();
  const btn=$('#submit'); btn.disabled=true; btn.textContent='もうひとりの自分が読んでいます…';
  try{
    const dec=await interpret(text,mood);
    const prev=JSON.stringify(S);
    S.seed=(S.seed||1)+1;
    const rng=mulberry32(hashStr(text+mood)+S.seed*9973);
    const res=applyAction(dec.action,dec.params||{},rng,mood);
    const ms=checkMilestone(rng);
    S.lastMood=mood;
    const label=LABEL[dec.action](dec.params||{});
    const reply=dec.reply||REPLY[mood]||REPLY[''];
    const entry={id:uid(),date:new Date().toISOString(),mood,text,action:dec.action,params:dec.params||{},label,reply,target:res.target,via:dec.via,milestone:ms?{m:ms.m,name:ms.name,target:ms.target}:null};
    E.push(entry);
    undoInfo={prev,id:entry.id};
    syncWalkers();
    const me=walkers.get('me');
    const pt=res.target||{x:me.x,y:me.y};
    celebrate(pt); focusOn(pt);
    me.bubble={text:reply,until:now()+7};
    react(dec.action,res,pt);
    toast('✦ '+label);
    clearTimeout(msTimer);
    const rm=$('#rMile'); rm.hidden=!ms;
    if(ms){ rm.textContent=`住人${ms.m}人達成！「${ms.name}」がひらけた`;
      for(const id of ms.ids) born.set(id,1e9);
      msTimer=setTimeout(()=>{ for(const id of ms.ids) born.set(id,now()); focusOn(ms.target); celebrate(ms.target);
        toast(`✦ 住人が${ms.m}人に！「${ms.name}」がひらけた`);
        crowd(ms.target,{act:'cheer',say:[`${ms.name}だ！`,'ひろくなった〜！','みんなでお祝い！'],meSay:'みんなのおかげで町が広がったよ',emotes:['star','note','heart'],dur:[4,5.5]}); },4200); }
    $('#rEp').textContent=`第${E.length}話 · ${fmtDate(entry.date).m}月${fmtDate(entry.date).d}日`;
    $('#rChange').textContent=label; $('#rReply').textContent='「'+reply+'」';
    $('#rVia').textContent= dec.via==='ai' ? 'Claudeが日記を読んで選びました' : 'キーワードと気分から選びました';
    $('#result').hidden=false; $('#undo').hidden=false;
    $('#text').value=''; mood=''; for(const x of moodsEl.children) x.setAttribute('aria-checked','false');
    renderUI(); renderChip();
    saveTown(); saveEntry(entry);
    if(innerWidth<860) $('#stage').scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'start'});
  } finally { btn.disabled=false; btn.textContent='箱庭に書く'; }
});
$('#undo').onclick=()=>{
  if(!undoInfo)return;
  closeRoom(); clearTimeout(msTimer); S=JSON.parse(undoInfo.prev); E=E.filter(e=>e.id!==undoInfo.id); deleteEntry(undoInfo.id); undoInfo=null;
  syncWalkers(); renderUI(); renderChip(); saveTown(); $('#result').hidden=true; cam.focus=null; cam.zoom=1; toast('いまの日記を取り消しました');
};
let resetArm=0;
$('#reset').onclick=async()=>{
  const b=$('#reset');
  if(Date.now()-resetArm>4000){ resetArm=Date.now(); b.textContent='もう一度押すと町と日記がすべて消えます'; setTimeout(()=>{ if(Date.now()-resetArm>=4000) b.textContent='はじめからやり直す'; },4100); return; }
  resetArm=0; b.textContent='はじめからやり直す'; closeRoom();
  const ids=E.map(e=>e.id); E=[]; clearLocal();
  if(store.mode==='cloud'){ try{ for(const id of ids) await store.entriesCol.doc(id).delete(); await store.townRef.delete(); }catch(e){} }
  S=newTown(DEFAULT_AVATAR,'はじまりの町'); walkers.clear(); syncWalkers(); renderUI(); renderChip(); $('#result').hidden=true;
  openCreator(true);
};

/* ---- avatar chip ---- */
const chipCtx=$('#chipCv').getContext('2d');
function renderChip(){ /* drawn in its own loop */ }
function chipLoop(){
  const t=now(); const c=chipCtx; c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,104,120);
  swapCtx(c,()=>{ c.setTransform(2,0,0,2,52,110); drawPerson(S.avatar,t,false,1,false,1.2,0); });
  requestAnimationFrame(chipLoop);
}
function swapCtx(c,fn){ const orig=ctx; ctx=c; try{fn()}finally{ctx=orig} }
$('#avatarChip').onclick=()=>openCreator(false);
$('#editAvatar').onclick=()=>openCreator(false);

/* ---- creator ---- */
let draft=null, creatorFirst=true;
const pvCtx=$('#pvCv').getContext('2d');
function optGroup(el,entries,key,type){
  el.innerHTML='';
  for(const [val,label,color] of entries){
    const b=document.createElement('button'); b.type='button'; b.setAttribute('role','radio');
    if(type==='sw'){ b.className='sw'; b.style.setProperty('--c',color); b.setAttribute('aria-label',label); }
    else { b.className='chip'; b.textContent=label; }
    b.dataset.v=val;
    b.onclick=()=>{ draft[key]=val; syncGroup(el,key); };
    el.appendChild(b);
  }
  syncGroup(el,key);
}
function syncGroup(el,key){ for(const b of el.children) b.setAttribute('aria-checked',String(b.dataset.v===draft[key])); }
function openCreator(first){
  creatorFirst=first; draft={...S.avatar};
  $('#cName').value=draft.name; $('#cTown').value=S.townName;
  $('#crTitle').textContent= first?'もうひとりの自分をつくる':'アバターを着がえる';
  $('#crLead').textContent= first?'この子があなたの写し。日記を書くたびに、この子と町が育っていきます。':'見た目を整えます。日記とは別なので、町は変わりません。';
  $('#crDone').textContent= first?'この姿で暮らしはじめる':'この姿にする';
  $('#crCancel').hidden=first;
  optGroup($('#oSkin'),Object.entries(SKIN).map(([k,c])=>[k,{light:'あかるい',fair:'ふつう',tan:'こんがり',deep:'ふかい'}[k],c]),'skin','sw');
  optGroup($('#oHair'),Object.entries(HAIRS).map(([k,l])=>[k,l]),'hair','chip');
  optGroup($('#oHairC'),Object.entries(HAIRC).map(([k,c])=>[k,HAIRC_JA[k],c]),'hairColor','sw');
  optGroup($('#oTop'),Object.entries(OUTFIT).map(([k,c])=>[k,OUTFIT_JA[k],c]),'outfit','sw');
  optGroup($('#oBot'),Object.entries(BOTTOM).map(([k,c])=>[k,{navy:'ネイビー',denim:'デニム',brown:'ブラウン',gray:'グレー',cream:'クリーム'}[k],c]),'bottom','sw');
  optGroup($('#oAcc'),Object.entries(ACC).map(([k,l])=>[k,l]),'acc','chip');
  $('#creator').hidden=false;
  setTimeout(()=>$('#cName').focus({preventScroll:true}),50);
}
$('#cName').addEventListener('input',e=>{ draft.name=e.target.value; });
$('#crCancel').onclick=()=>{ $('#creator').hidden=true; };
$('#crDone').onclick=()=>{
  draft.name=($('#cName').value.trim()||'わたし').slice(0,10);
  const town=($('#cTown').value.trim()||'はじまりの町').slice(0,12);
  S.avatar={...draft}; S.townName=town;
  $('#creator').hidden=true; syncWalkers(); renderUI();
  const me=walkers.get('me'); me.bubble={text: creatorFirst?`${S.avatar.name}だよ。今日のこと、教えてね`:'どうかな？',until:now()+6};
  saveTown();
  if(creatorFirst) setTimeout(()=>$('#text').focus({preventScroll:true}),200);
};
function pvLoop(){
  const t=now(); const c=pvCtx;
  if(!$('#creator').hidden && draft){
    c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,400,460);
    $('#pvName').textContent=($('#cName').value.trim()||'わたし');
    swapCtx(c,()=>{
      c.setTransform(2,0,0,2,200,300);
      // little tile
      const q=(a)=>a.map(([x,y])=>[x*1.6,y*1.6]);
      poly(q([[0,-16],[32,0],[0,16],[-32,0]]),'#a3d97c');
      poly(q([[-32,0],[0,16],[0,30],[-32,14]]),'#94683f'); poly(q([[0,16],[32,0],[32,14],[0,30]]),'#b07f55');
      poly(q([[-32,0],[0,16],[0,19],[-32,3]]),shade('#6fb357',-0.12)); poly(q([[0,16],[32,0],[32,3],[0,19]]),'#6fb357');
      c.setTransform(2,0,0,2,200,302);
      const phase=Math.floor(t/2.4)%2; const flip=phase===1?-1:1, back=false;
      drawPerson(draft,t,true,flip,back,2.1,0);
    });
  }
  requestAnimationFrame(pvLoop);
}


/* ---------------- boot ---------------- */
async function boot(){
  syncWalkers(); renderUI(); setStoreNote('読み込み中…');
  requestAnimationFrame(frame); requestAnimationFrame(pvLoop); requestAnimationFrame(chipLoop);
  await initStorage();
  let data=null; try{ data=await loadAll(); }catch(e){}
  if(data&&data.town){
    S=Object.assign(newTown(DEFAULT_AVATAR,''),data.town); S.avatar={...DEFAULT_AVATAR,...S.avatar};
    E=data.entries||[]; walkers.clear(); syncWalkers(); renderUI();
    writeLocal();
  } else {
    openCreator(true);
  }
  ready=true; setStoreNote(); updateAiNote();
}
boot();
})();
</script>

</body>
